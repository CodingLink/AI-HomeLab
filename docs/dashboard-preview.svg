<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">AI HomeLab dashboard preview</title>
  <desc id="desc">A sanitized illustration of the HomeDash AI dashboard with usage cards, provider quotas, recent activity, and model rankings.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#181817" flood-opacity=".06"/>
    </filter>
    <style>
      .ink{fill:#181817;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .muted{fill:#8b8b86;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .blue{fill:#3f82d7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .small{font-size:14px}.body{font-size:16px}.label{font-size:18px;font-weight:600}.value{font-size:30px;font-weight:650}.heading{font-size:38px;font-weight:700}.card{fill:#fff;stroke:#e0e0dc;stroke-width:2}
    </style>
  </defs>

  <rect width="1280" height="900" fill="#f7f7f4"/>
  <rect x="24" y="22" width="1232" height="856" rx="24" fill="#fff" stroke="#deded9" stroke-width="2"/>

  <g transform="translate(56 48)">
    <text class="muted small" letter-spacing="2">HOME</text>
    <text class="ink" y="30" font-size="24" font-weight="700">HomeDash</text>
  </g>
  <g transform="translate(290 62)" class="ink body">
    <text x="0">Home</text><text x="90" font-weight="700">AI</text><rect x="89" y="24" width="27" height="3" rx="2" fill="#181817"/>
  </g>
  <g transform="translate(1080 61)">
    <circle cx="0" cy="0" r="5" fill="#20a463"/><text x="14" y="5" class="muted small">实时</text>
    <text x="76" y="5" class="muted small">本机</text>
  </g>
  <line x1="48" y1="105" x2="1232" y2="105" stroke="#ededE9" stroke-width="2"/>

  <text x="76" y="160" class="muted small" letter-spacing="2">DASHBOARD</text>
  <text x="76" y="204" class="ink heading">AI</text>
  <g transform="translate(862 143)">
    <rect width="158" height="48" rx="14" fill="#f1f1ee" stroke="#deded9" stroke-width="2"/>
    <rect x="4" y="4" width="74" height="40" rx="11" fill="#fff"/>
    <text x="19" y="31" class="ink body" font-weight="650">本地</text>
    <text x="93" y="31" class="muted body">OpenRouter</text>
  </g>
  <g transform="translate(1038 143)">
    <rect width="158" height="48" rx="14" fill="#f1f1ee" stroke="#deded9" stroke-width="2"/>
    <rect x="4" y="4" width="49" height="40" rx="11" fill="#fff"/>
    <text x="17" y="31" class="ink body" font-weight="650">今日</text>
    <text x="72" y="31" class="muted body">7天</text><text x="118" y="31" class="muted body">30天</text>
  </g>

  <g transform="translate(76 242)">
    <g filter="url(#shadow)">
      <rect class="card" width="265" height="112" rx="18"/>
      <rect class="card" x="280" width="265" height="112" rx="18"/>
      <rect class="card" x="560" width="265" height="112" rx="18"/>
      <rect class="card" x="840" width="265" height="112" rx="18"/>
    </g>
    <text x="22" y="31" class="muted body">今日用量</text><text x="22" y="73" class="ink value">128</text><text x="22" y="96" class="blue small">次请求</text>
    <text x="302" y="31" class="muted body">主要模型</text><text x="302" y="73" class="ink" font-size="24" font-weight="650">GPT-5.6</text><text x="302" y="96" class="blue small">按 Token 用量</text>
    <text x="582" y="31" class="muted body">平均 TTFT</text><text x="582" y="73" class="ink value">1,240 ms</text><text x="582" y="96" class="blue small">查看趋势</text>
    <text x="862" y="31" class="muted body">总 Token</text><text x="862" y="73" class="ink value">3.6M</text><text x="862" y="96" class="blue small">输入 ↑ 2.1M · 输出 ↓ 1.5M</text>
  </g>

  <g transform="translate(76 378)">
    <rect class="card" width="1105" height="128" rx="18" filter="url(#shadow)"/>
    <text x="22" y="31" class="muted body">Provider 额度</text><text x="22" y="65" class="ink" font-size="22" font-weight="650">剩余额度</text>
    <g transform="translate(245 26)"><text class="ink label">Kimi Code</text><circle cx="115" cy="-6" r="5" fill="#20a463"/><text x="128" y="0" class="muted small">实时</text><text x="0" y="34" class="muted small">7 天限额</text><text x="177" y="34" class="ink small">剩余 76%</text><rect y="49" width="245" height="8" rx="4" fill="#e4e4df"/><rect y="49" width="186" height="8" rx="4" fill="#3f82d7"/></g>
    <g transform="translate(650 26)"><text class="ink label">OpenRouter</text><circle cx="122" cy="-6" r="5" fill="#20a463"/><text x="135" y="0" class="muted small">实时</text><text x="0" y="34" class="muted small">可用余额</text><text x="0" y="65" class="ink" font-size="24" font-weight="650">$24.80</text><text x="120" y="65" class="muted small">Credits</text></g>
  </g>

  <g transform="translate(76 538)">
    <rect class="card" width="655" height="298" rx="18" filter="url(#shadow)"/>
    <text x="22" y="33" class="muted body">最近活动</text><text x="22" y="66" class="ink" font-size="22" font-weight="650">请求记录</text><text x="550" y="33" class="muted small">平滑更新</text>
    <g transform="translate(22 91)">
      <text class="ink label">GPT-5.6</text><circle cx="115" cy="-6" r="5" fill="#20a463"/><text x="130" y="0" class="muted small">完成</text><text y="28" class="muted small">TTFT 820 ms　 Time 4.6 s　 TPS 48.2/s</text><line y1="47" x2="611" stroke="#ededE9"/>
      <text y="82" class="ink label">Claude Sonnet</text><circle cx="171" cy="-6" r="5" fill="#20a463"/><text x="186" y="0" class="muted small">调用中</text><text y="110" class="muted small">TTFT ≈ 640 ms　 Time —　 TPS ≈ 42/s</text><line y1="129" x2="611" stroke="#ededE9"/>
      <text y="164" class="ink label">Kimi K3</text><circle cx="107" cy="-6" r="5" fill="#20a463"/><text x="122" y="0" class="muted small">完成</text><text y="192" class="muted small">TTFT 1,080 ms　 Time 7.1 s　 TPS 35.8/s</text>
    </g>
  </g>

  <g transform="translate(756 538)">
    <rect class="card" width="425" height="298" rx="18" filter="url(#shadow)"/>
    <text x="22" y="33" class="muted body">模型排行</text><text x="22" y="66" class="ink" font-size="22" font-weight="650">Token 占比</text><text x="342" y="33" class="muted small">128 次</text>
    <g transform="translate(22 96)">
      <text class="ink label">GPT-5.6</text><text x="345" class="muted small">52%</text><rect y="22" width="380" height="8" rx="4" fill="#e4e4df"/><rect y="22" width="198" height="8" rx="4" fill="#545450"/>
      <text y="67" class="ink label">Claude Sonnet</text><text x="345" y="0" class="muted small">29%</text><rect y="89" width="380" height="8" rx="4" fill="#e4e4df"/><rect y="89" width="110" height="8" rx="4" fill="#545450"/>
      <text y="134" class="ink label">Kimi K3</text><text x="345" y="134" class="muted small">19%</text><rect y="156" width="380" height="8" rx="4" fill="#e4e4df"/><rect y="156" width="72" height="8" rx="4" fill="#545450"/>
    </g>
  </g>
</svg>
